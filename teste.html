<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previsão do Tempo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Camadas de Nuvens Animadas -->
  <div class="sky-background">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <!-- Conteúdo Principal -->
  <main class="card">
    <h1>Previsão do Tempo</h1>
    <p>Consulte as condições meteorológicas em tempo real.</p>
    
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Digite o nome da cidade...">
      <button id="searchBtn">Buscar</button>
    </div>

    <div id="weatherResult" class="weather-result">
      <!-- Os dados da API podem ser inseridos aqui via JavaScript -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
